# services/gateway-service/src/main/resources/application.yml
server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: schema-registry
          uri: ${SCHEMA_REGISTRY_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/schemas/**

        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/analytics/**

        - id: query-service-rest
          uri: ${QUERY_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/query/**

        - id: query-service-graphql
          uri: ${QUERY_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/graphql/**, /graphiql/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, gateway
  endpoint:
    health:
      show-details: always