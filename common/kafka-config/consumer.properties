# common/kafka-config/consumer.properties

# Core Group and Cluster Configuration
group.id=analytics-event-processor-group
bootstrap.servers=kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092

# Schema Registry Integration
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
schema.registry.url=http://schema-registry:8081
specific.avro.reader=true

# Offset Management & Commits
enable.auto.commit=false
auto.offset.reset=earliest
isolation.level=read_committed

# Performance and Throughput Tuning (Optimized for 100K+ events/min)
fetch.min.bytes=1048576
fetch.max.wait.ms=500
max.partition.fetch.bytes=5242880
max.poll.records=2500
receive.buffer.bytes=1048576

# Consumer Heartbeat & Rebalance Tuning
session.timeout.ms=45000
heartbeat.interval.ms=15000
max.poll.interval.ms=300000
partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor