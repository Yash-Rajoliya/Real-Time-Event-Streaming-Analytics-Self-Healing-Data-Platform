# infra/docker/kafka/server.properties

############################# Broker Basics #############################
broker.id=1
reserved.broker.max.id=1000

############################# Socket Server Settings #############################
listeners=INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092
advertised.listeners=INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092
listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
inter.broker.listener.name=INTERNAL

num.network.threads=8
num.io.threads=16
socket.send.buffer.bytes=1048576
socket.receive.buffer.bytes=1048576
socket.request.max.bytes=104857600
queued.max.requests=10000

############################# Log Basics #############################
log.dirs=/var/lib/kafka/data
num.recovery.threads.per.data.dir=4

############################# Internal Topic Configurations #############################
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
default.replication.factor=3
num.partitions=12

############################# High Throughput & Memory Tuning #############################
# 100K+ events/min optimization settings
compression.type=snappy
producer.purgatory.purge.interval.requests=1000
fetch.purgatory.purge.interval.requests=1000

############################# Log Flush Policy #############################
# Rely on OS page cache and replication for durability
log.flush.interval.messages=9223372036854775807
log.flush.interval.ms=9223372036854775807
log.flush.scheduler.interval.ms=2000

############################# Log Retention and Segment Management #############################
log.retention.hours=168
log.retention.check.interval.ms=300000
log.segment.bytes=1073741824
log.segment.delete.delay.ms=60000
log.cleanup.policy=delete

############################# Replication & High Availability #############################
min.insync.replicas=2
unclean.leader.election.enable=false
auto.leader.rebalance.enable=true
leader.imbalance.per.broker.percentage=1
replica.fetch.max.bytes=5242880
replica.fetch.response.max.bytes=10485760
replica.high.watermark.checkpoint.interval.ms=5000

############################# Zookeeper Connection #############################
zookeeper.connect=zookeeper:2181
zookeeper.connection.timeout.ms=18000
zookeeper.session.timeout.ms=18000
zookeeper.max.in.flight.requests=16

############################# Group Coordinator Settings #############################
group.initial.rebalance.delay.ms=3000